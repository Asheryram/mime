name: Scrape new leads

on:
  schedule:
    # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

# Shared with send-pipeline.yml so the two never run at once (e.g. a "Run now"
# from the dashboard landing on top of a scheduled run) and fight over the queue.
concurrency:
  group: outreach-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # Your private companion repo (owner/name) holding outreach_queue.csv,
      # outreach_log.csv and search_queries.txt - set this as a repo Variable
      # (Settings -> Secrets and variables -> Actions -> Variables) if you
      # forked this repo; the fallback only matches the original author's.
      STATE_REPO: ${{ vars.STATE_REPO || 'Asheryram/mime-state' }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      APPLICANT_EMAIL: ${{ secrets.APPLICANT_EMAIL }}
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up deploy key for the private state repo
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STATE_DEPLOY_KEY }}" > ~/.ssh/state_deploy_key
          chmod 600 ~/.ssh/state_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host state-repo
            HostName github.com
            User git
            IdentityFile ~/.ssh/state_deploy_key
            IdentitiesOnly yes
          EOF

      - name: Pull current state (queue, log, searches)
        run: |
          git clone state-repo:${STATE_REPO}.git state-repo
          cp state-repo/outreach_queue.csv .
          cp state-repo/outreach_log.csv . || true
          cp state-repo/search_queries.txt . || true

      - name: Search for new candidate companies
        run: python3 outreach_pipeline.py search-all

      - name: Scrape contact emails
        run: python3 outreach_pipeline.py scrape

      - name: Email a summary of rows that need a human
        run: python3 outreach_pipeline.py notify-review

      - name: Push updated state back to the private repo
        if: always()
        run: |
          cp outreach_queue.csv state-repo/outreach_queue.csv
          cp outreach_log.csv state-repo/outreach_log.csv || true
          cd state-repo
          git config user.name "mime-ci"
          git config user.email "actions@users.noreply.github.com"
          git add outreach_queue.csv outreach_log.csv
          git diff --cached --quiet && exit 0
          git commit -m "Scrape run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The dashboard may have edited the queue while this ran. Rebase onto
          # it (row-level edits merge cleanly) instead of failing the push.
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main || { git rebase --abort; echo "Conflicting edit to the same row; see the queue history."; exit 1; }
          done
          exit 1
