name: Scrape new leads

on:
  schedule:
    # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    # Every 6 hours at :17, off the hour so GitHub doesn't delay it.
    # Keep in step with SCRAPE_* in webapp/app.py.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      tenant:
        # Set by an invited user's "Run now" on the dashboard: runs only that
        # user, never the owner's own pipeline.
        description: "Only this invited user (blank = owner and everyone)"
        type: string
        default: ""

# Shared with send-pipeline.yml so the two never run at once (e.g. a "Run now"
# from the dashboard landing on top of a scheduled run) and fight over the queue.
concurrency:
  group: outreach-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # Your private companion repo (owner/name) holding outreach_queue.csv,
      # outreach_log.csv and search_queries.txt - set this as a repo Variable
      # (Settings -> Secrets and variables -> Actions -> Variables) if you
      # forked this repo; the fallback only matches the original author's.
      STATE_REPO: ${{ vars.STATE_REPO || 'Asheryram/mime-state' }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      APPLICANT_EMAIL: ${{ secrets.APPLICANT_EMAIL }}
      # Your dashboard's address, for the "Fix" links in the review email. A
      # DASHBOARD_URL repo Variable overrides it (e.g. for a fork).
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://sage-apply.vercel.app' }}
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up deploy key for the private state repo
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STATE_DEPLOY_KEY }}" > ~/.ssh/state_deploy_key
          chmod 600 ~/.ssh/state_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host state-repo
            HostName github.com
            User git
            IdentityFile ~/.ssh/state_deploy_key
            IdentitiesOnly yes
          EOF

      - name: Pull current state (queue, log, searches, roles)
        run: |
          git clone state-repo:${STATE_REPO}.git state-repo
          cp state-repo/outreach_queue.csv .
          cp state-repo/outreach_log.csv . || true
          cp state-repo/search_queries.txt . || true
          # Roles edited on the dashboard; absent until the first save, in
          # which case applicant.py uses webapp/tracks_default.json.
          cp state-repo/tracks.json . || true

      - name: Mark replies and bounces from the inbox
        if: ${{ !inputs.tenant }}
        # Every 6 hours, so the dashboard's Replied and reply rate stay current.
        run: python3 outreach_pipeline.py check-inbox

      - name: Search for new candidate companies
        if: ${{ !inputs.tenant }}
        run: python3 outreach_pipeline.py search-all

      - name: Scrape contact emails
        if: ${{ !inputs.tenant }}
        run: python3 outreach_pipeline.py scrape

      - name: Email a summary of rows that need a human
        if: ${{ !inputs.tenant }}
        run: python3 outreach_pipeline.py notify-review

      - name: Run the pipeline for invited users
        # Each user runs isolated: own folder, own credentials, own process
        # (see tenants.py). Runs even if the owner's steps failed, and one
        # user's failure never fails this job.
        if: always()
        env:
          SECRETS_KEY: ${{ secrets.SECRETS_KEY }}
          SENDER_EMAIL: ""
          GMAIL_APP_PASSWORD: ""
          APPLICANT_EMAIL: ""
          APPLICANT_PHONE: ""
          EXA_API_KEY: ""
          APIFY_API_TOKEN: ""
        run: python3 tenants.py scrape --state state-repo --only "${{ inputs.tenant }}"

      - name: Push updated state back to the private repo
        if: always()
        run: |
          cp outreach_queue.csv state-repo/outreach_queue.csv
          cp outreach_log.csv state-repo/outreach_log.csv || true
          cd state-repo
          git config user.name "mime-ci"
          git config user.email "actions@users.noreply.github.com"
          git add outreach_queue.csv outreach_log.csv
          git add tenants 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Scrape run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The dashboard may have edited the queue while this ran. Rebase onto
          # it (row-level edits merge cleanly) instead of failing the push.
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main || { git rebase --abort; echo "Conflicting edit to the same row; see the queue history."; exit 1; }
          done
          exit 1
