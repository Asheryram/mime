name: Daily send pipeline

on:
  schedule:
    # 09:00 UTC = 9am in Accra (GMT, no DST)
    - cron: "0 9 * * *"
  workflow_dispatch: {}

concurrency:
  group: send-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # Your private companion repo (owner/name) holding outreach_queue.csv,
      # outreach_log.csv, and your CV - set this as a repo Variable (Settings
      # -> Secrets and variables -> Actions -> Variables) if you forked this
      # repo; the fallback only matches the original author's own repo.
      STATE_REPO: ${{ vars.STATE_REPO || 'Asheryram/mime-state' }}
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      APPLICANT_PHONE: ${{ secrets.APPLICANT_PHONE }}
      APPLICANT_EMAIL: ${{ secrets.APPLICANT_EMAIL }}
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up deploy key for the private state repo
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STATE_DEPLOY_KEY }}" > ~/.ssh/state_deploy_key
          chmod 600 ~/.ssh/state_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host state-repo
            HostName github.com
            User git
            IdentityFile ~/.ssh/state_deploy_key
            IdentitiesOnly yes
          EOF

      - name: Pull current state (queue, log, CV)
        run: |
          git clone state-repo:${STATE_REPO}.git state-repo
          cp state-repo/outreach_queue.csv .
          cp state-repo/outreach_log.csv . || true
          cv_path="$(python3 -c 'import applicant; print(applicant.CV_PATH)')"
          cp "state-repo/$cv_path" "$cv_path"

      - name: Auto-approve reviewed leads
        run: python3 outreach_pipeline.py auto-approve

      - name: Generate cover letters
        run: python3 outreach_pipeline.py generate

      - name: Send approved applications
        run: python3 outreach_pipeline.py send

      - name: Send eligible follow-ups
        run: python3 followup_pipeline.py run

      - name: Push updated state back to the private repo
        if: always()
        run: |
          cp outreach_queue.csv state-repo/outreach_queue.csv
          cp outreach_log.csv state-repo/outreach_log.csv || true
          cd state-repo
          git config user.name "mime-ci"
          git config user.email "actions@users.noreply.github.com"
          git add outreach_queue.csv outreach_log.csv
          git diff --cached --quiet || git commit -m "Daily send run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
