name: Daily send pipeline

on:
  schedule:
    # 09:00 UTC = 9am in Accra (GMT, no DST)
    # 07:23 UTC (= Accra) on weekdays. Off the hour on purpose: GitHub delays
    # top-of-the-hour schedules when busy, and "0 9" was running at ~18:00,
    # landing applications after work. Weekends are skipped: a cold email sent
    # Saturday sits under Monday's pile. Keep in step with SEND_* in webapp/app.py.
    - cron: "23 7 * * 1-5"
  workflow_dispatch: {}

# Shared with scrape-pipeline.yml so the two never run at once (e.g. a "Run now"
# from the dashboard landing on top of a scheduled run) and fight over the queue.
concurrency:
  group: outreach-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # Your private companion repo (owner/name) holding outreach_queue.csv,
      # outreach_log.csv, and your CV - set this as a repo Variable (Settings
      # -> Secrets and variables -> Actions -> Variables) if you forked this
      # repo; the fallback only matches the original author's own repo.
      STATE_REPO: ${{ vars.STATE_REPO || 'Asheryram/mime-state' }}
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      APPLICANT_PHONE: ${{ secrets.APPLICANT_PHONE }}
      APPLICANT_EMAIL: ${{ secrets.APPLICANT_EMAIL }}
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up deploy key for the private state repo
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STATE_DEPLOY_KEY }}" > ~/.ssh/state_deploy_key
          chmod 600 ~/.ssh/state_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host state-repo
            HostName github.com
            User git
            IdentityFile ~/.ssh/state_deploy_key
            IdentitiesOnly yes
          EOF

      - name: Pull current state (queue, log, roles, CVs)
        run: |
          git clone state-repo:${STATE_REPO}.git state-repo
          cp state-repo/outreach_queue.csv .
          cp state-repo/outreach_log.csv . || true
          # Roles edited on the dashboard; absent until the first save, in
          # which case applicant.py uses webapp/tracks_default.json. Must be
          # copied before the CV loop below, which reads cv_path from it.
          cp state-repo/tracks.json . || true
          # One CV per track. A missing one is not an error here: send and
          # follow-up hold that track's rows until it's uploaded.
          for cv_path in $(python3 -c 'import applicant; print(" ".join(sorted({t["cv_path"] for t in applicant.TRACKS.values()})))'); do
            if [ -f "state-repo/$cv_path" ]; then
              cp "state-repo/$cv_path" "$cv_path"
            else
              echo "::warning::No CV at $cv_path in the state repo; rows on that track are held until it's added."
            fi
          done

      - name: Mark replies and bounces from the inbox
        # Before anything is sent: a follow-up must never chase someone who
        # already replied. Read-only, headers only (see inbox_check.py).
        run: python3 outreach_pipeline.py check-inbox

      - name: Auto-approve clean leads
        run: python3 outreach_pipeline.py auto-approve

      - name: Generate cover letters
        run: python3 outreach_pipeline.py generate

      - name: Send approved applications
        run: python3 outreach_pipeline.py send

      - name: Send eligible follow-ups
        run: python3 followup_pipeline.py run

      - name: Push updated state back to the private repo
        if: always()
        run: |
          cp outreach_queue.csv state-repo/outreach_queue.csv
          cp outreach_log.csv state-repo/outreach_log.csv || true
          cd state-repo
          git config user.name "mime-ci"
          git config user.email "actions@users.noreply.github.com"
          git add outreach_queue.csv outreach_log.csv
          git diff --cached --quiet && exit 0
          git commit -m "Daily send run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # This run can take ~15 minutes (spaced-out sends), and the dashboard
          # may have edited the queue meanwhile. Losing this push would lose the
          # "Sent" marks and re-send tomorrow, so rebase onto those edits
          # (row-level changes merge cleanly) instead of failing.
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main || { git rebase --abort; echo "Conflicting edit to the same row; see the queue history."; exit 1; }
          done
          exit 1
