name: Daily outreach pipeline

on:
  schedule:
    # 07:00 UTC = 07:00 in Accra (GMT, no DST)
    - cron: "0 7 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-outreach-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      APPLICANT_PHONE: ${{ secrets.APPLICANT_PHONE }}
      APPLICANT_EMAIL: ${{ secrets.APPLICANT_EMAIL }}
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up deploy key for the private state repo
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STATE_DEPLOY_KEY }}" > ~/.ssh/state_deploy_key
          chmod 600 ~/.ssh/state_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host state-repo
            HostName github.com
            User git
            IdentityFile ~/.ssh/state_deploy_key
            IdentitiesOnly yes
          EOF

      - name: Pull current state (queue, log, CV)
        run: |
          git clone state-repo:Asheryram/mime-state.git state-repo
          cp state-repo/outreach_queue.csv .
          cp state-repo/outreach_log.csv . || true
          cp state-repo/YramAsherTettehAbotsi_resume.pdf .

      - name: Search for new candidate companies
        run: |
          python3 outreach_pipeline.py search "cloud and devops engineering companies Accra Ghana" 10
          python3 outreach_pipeline.py search "fintech and payments companies hiring engineers Ghana" 10

      - name: Scrape contact emails
        run: python3 outreach_pipeline.py scrape

      - name: Auto-approve scraped rows (no human in the loop by design)
        run: python3 outreach_pipeline.py auto-approve

      - name: Generate cover letters
        run: python3 outreach_pipeline.py generate

      - name: Send approved applications
        run: python3 outreach_pipeline.py send

      - name: Send eligible follow-ups
        run: python3 followup_pipeline.py run

      - name: Push updated state back to the private repo
        if: always()
        run: |
          cp outreach_queue.csv state-repo/outreach_queue.csv
          cp outreach_log.csv state-repo/outreach_log.csv || true
          cd state-repo
          git config user.name "mime-ci"
          git config user.email "actions@users.noreply.github.com"
          git add outreach_queue.csv outreach_log.csv
          git diff --cached --quiet || git commit -m "Daily pipeline run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
