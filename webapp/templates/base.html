<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Outreach Triage Desk{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #f3f1ea; --surface: #ffffff; --fg: #16231f; --muted: #5b6b66; --border: #dcdfd7;
    --accent: #0f766e; --accent-fg: #ffffff;
    --good: #1f7a4d; --good-bg: #e4f3ea;
    --warn: #8a5a00; --warn-bg: #fbf0dc;
    --bad: #a1324f; --bad-bg: #f8e4e9;
    --chip-bg: #eef2f0;
    --font-ui: "IBM Plex Sans", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10181a; --surface: #182325; --fg: #e7ece9; --muted: #9fb0ac; --border: #2b3a3b;
      --accent: #2dd4c4; --accent-fg: #062420;
      --good: #4ade9b; --good-bg: #163226;
      --warn: #f5c451; --warn-bg: #352a10;
      --bad: #fb90a8; --bad-bg: #37161e;
      --chip-bg: #1f2b2a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); margin: 0; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 48px; }
  .auth-wrap { max-width: 380px; margin: 10vh auto; padding: 0 16px; }
  h1 { font-size: 1.3rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .tagline { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
  a { color: var(--accent); }
  .card-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px;
  }
  label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
  input[type="text"], input[type="email"], input[type="password"], select {
    width: 100%; font: inherit; font-size: 0.92rem; color: var(--fg); background: var(--bg);
    border: 1px solid var(--border); border-radius: 7px; padding: 9px 10px; margin-bottom: 14px;
  }
  button, .btn {
    font: inherit; font-size: 0.85rem; font-weight: 600; border-radius: 7px; border: 1px solid transparent;
    padding: 8px 14px; cursor: pointer; white-space: nowrap; background: var(--accent); color: var(--accent-fg);
  }
  button.ghost, .btn.ghost { background: transparent; color: var(--muted); border-color: var(--border); }
  button.good { background: var(--good-bg); color: var(--good); }
  button.bad { background: var(--bad-bg); color: var(--bad); }
  .flash { border-radius: 8px; padding: 10px 14px; font-size: 0.85rem; margin-bottom: 14px; }
  .flash.error { background: var(--bad-bg); color: var(--bad); }
  .flash.success { background: var(--good-bg); color: var(--good); }
  .muted-link { font-size: 0.82rem; color: var(--muted); }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
