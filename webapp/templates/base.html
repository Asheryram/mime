<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Outreach Triage Desk{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Dark gradient backdrop with blurred color blobs; every panel is frosted
     glass (translucent + backdrop-filter blur) floating above it. */
  :root {
    --bg-1: #0a0e1a; --bg-2: #160d2e; --bg-3: #05131c;
    --fg: #eef1f7; --muted: #9aa3bf; --muted-dim: #6d7596;
    --glass: rgba(255, 255, 255, 0.07); --glass-hi: rgba(255, 255, 255, 0.12);
    --glass-border: rgba(255, 255, 255, 0.14);
    --accent: #2dd4c4; --accent-2: #a78bfa; --accent-fg: #062420;
    --good: #4ade9b; --good-bg: rgba(74, 222, 155, 0.16);
    --warn: #f5c451; --warn-bg: rgba(245, 196, 81, 0.16);
    --bad: #fb90a8; --bad-bg: rgba(251, 144, 168, 0.16);
    --font-ui: "IBM Plex Sans", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  /* Blobs are baked into the normal (scrolling) background instead of fixed
     position + blur() pseudo-elements, which only paint one viewport tall and
     go flat black below that on any page taller than the screen. */
  body {
    margin: 0; min-height: 100%; color: var(--fg); font-family: var(--font-ui);
    background:
      radial-gradient(ellipse 65% 40% at 14% 0%, rgba(45, 212, 196, 0.24), transparent 65%),
      radial-gradient(ellipse 60% 45% at 88% 28%, rgba(13, 110, 120, 0.22), transparent 60%),
      radial-gradient(ellipse 70% 45% at 8% 92%, rgba(167, 139, 250, 0.20), transparent 65%),
      linear-gradient(160deg, var(--bg-1), var(--bg-3) 70%);
    position: relative;
  }

  .wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 20px 16px 56px; }
  .auth-wrap { position: relative; z-index: 1; max-width: 400px; margin: 9vh auto; padding: 0 16px; }

  h1 { font-size: 1.4rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .tagline { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
  a { color: var(--accent); }

  .card-box {
    background: linear-gradient(155deg, var(--glass-hi), var(--glass));
    border: 1px solid var(--glass-border); border-radius: 18px; padding: 26px;
    backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
  }

  label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
  input[type="text"], input[type="email"], input[type="password"], select {
    width: 100%; font: inherit; font-size: 0.92rem; color: var(--fg);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--glass-border); border-radius: 8px; padding: 9px 10px; margin-bottom: 14px;
  }
  input::placeholder { color: var(--muted-dim); }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  button, .btn {
    font: inherit; font-size: 0.85rem; font-weight: 600; border-radius: 8px; border: 1px solid transparent;
    padding: 8px 14px; cursor: pointer; white-space: nowrap;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-fg);
  }
  button:hover, .btn:hover { filter: brightness(1.08); }
  button.ghost, .btn.ghost {
    background: var(--glass); color: var(--muted); border-color: var(--glass-border);
  }
  button.ghost:hover { color: var(--fg); }
  button.good { background: var(--good-bg); color: var(--good); }
  button.bad { background: var(--bad-bg); color: var(--bad); }

  .flash { border-radius: 10px; padding: 10px 14px; font-size: 0.85rem; margin-bottom: 14px; }
  .flash.error { background: var(--bad-bg); color: var(--bad); }
  .flash.success { background: var(--good-bg); color: var(--good); }
  .muted-link { font-size: 0.82rem; color: var(--muted); }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
