<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Outreach Triage Desk{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Dark gradient backdrop with blurred color blobs; every panel is frosted
     glass (translucent + backdrop-filter blur) floating above it. */
  :root {
    --bg-1: #0a0e1a; --bg-2: #160d2e; --bg-3: #05131c;
    --fg: #eef1f7; --muted: #9aa3bf; --muted-dim: #6d7596;
    --glass: rgba(255, 255, 255, 0.07); --glass-hi: rgba(255, 255, 255, 0.12);
    --glass-border: rgba(255, 255, 255, 0.14);
    --accent: #2dd4c4; --accent-2: #a78bfa; --accent-fg: #062420;
    --good: #4ade9b; --good-bg: rgba(74, 222, 155, 0.16);
    --warn: #f5c451; --warn-bg: rgba(245, 196, 81, 0.16);
    --bad: #fb90a8; --bad-bg: rgba(251, 144, 168, 0.16);
    --font-ui: "IBM Plex Sans", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  /* Blobs are baked into the normal (scrolling) background instead of fixed
     position + blur() pseudo-elements, which only paint one viewport tall and
     go flat black below that on any page taller than the screen. */
  body {
    margin: 0; min-height: 100%; color: var(--fg); font-family: var(--font-ui);
    background:
      radial-gradient(ellipse 65% 40% at 14% 0%, rgba(45, 212, 196, 0.24), transparent 65%),
      radial-gradient(ellipse 60% 45% at 88% 28%, rgba(13, 110, 120, 0.22), transparent 60%),
      radial-gradient(ellipse 70% 45% at 8% 92%, rgba(167, 139, 250, 0.20), transparent 65%),
      linear-gradient(160deg, var(--bg-1), var(--bg-3) 70%);
    position: relative;
  }

  .wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 20px 16px 56px; }
  .auth-wrap { position: relative; z-index: 1; max-width: 400px; margin: 9vh auto; padding: 0 16px; }

  h1 { font-size: 1.4rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .tagline { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
  .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  a { color: var(--accent); }

  .card-box {
    background: linear-gradient(155deg, var(--glass-hi), var(--glass));
    border: 1px solid var(--glass-border); border-radius: 18px; padding: 26px;
    backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
  }

  label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
  input[type="text"], input[type="email"], input[type="password"], select {
    width: 100%; font: inherit; font-size: 0.92rem; color: var(--fg);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--glass-border); border-radius: 8px; padding: 9px 10px; margin-bottom: 14px;
  }
  input::placeholder { color: var(--muted-dim); }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  button, .btn {
    font: inherit; font-size: 0.85rem; font-weight: 600; border-radius: 8px; border: 1px solid transparent;
    padding: 8px 14px; cursor: pointer; white-space: nowrap;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-fg);
  }
  button:hover, .btn:hover { filter: brightness(1.08); }
  button.ghost, .btn.ghost {
    background: var(--glass); color: var(--muted); border-color: var(--glass-border);
  }
  button.ghost:hover { color: var(--fg); }
  button.good { background: var(--good-bg); color: var(--good); }
  button.bad { background: var(--bad-bg); color: var(--bad); }

  .flash { border-radius: 10px; padding: 10px 14px; font-size: 0.85rem; margin-bottom: 14px; }
  .flash.error { background: var(--bad-bg); color: var(--bad); }
  .flash.success { background: var(--good-bg); color: var(--good); }
  .muted-link { font-size: 0.82rem; color: var(--muted); }

  /* Shared nav tabs - every logged-in page includes _nav.html under its header */
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .tab {
    display: inline-flex; align-items: center; gap: 7px; font-size: 0.82rem; font-weight: 500;
    color: var(--muted); background: var(--glass); border: 1px solid var(--glass-border);
    border-radius: 999px; padding: 7px 14px; text-decoration: none; white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--accent-fg); background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; }
  .tab .tab-count {
    font-family: var(--font-mono); font-size: 0.7rem; background: rgba(255, 255, 255, 0.14);
    border-radius: 999px; padding: 0 7px;
  }
  .tab.active .tab-count { background: rgba(0, 0, 0, 0.18); }

  /* Stat tiles (overview) */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat-tile { padding: 16px 18px; }
  .stat-tile.linkable { text-decoration: none; display: block; transition: transform 0.12s; }
  .stat-tile.linkable:hover { transform: translateY(-2px); }
  .stat-num { font-family: var(--font-mono); font-size: 1.6rem; font-weight: 500; line-height: 1; color: var(--fg); }
  .stat-label { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 6px; }

  /* Card grid (overview launcher cards, and single-section pages) */
  .panel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 20px; margin-bottom: 20px; }
  .panel { display: flex; flex-direction: column; min-width: 0; }
  .panel-head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
  .panel-head h2 { font-size: 1rem; font-weight: 600; margin: 0; }
  .count-badge { font-family: var(--font-mono); font-size: 0.72rem; background: var(--glass); color: var(--muted); border-radius: 999px; padding: 1px 9px; }
  .panel .hint { color: var(--muted); font-size: 0.8rem; margin: 2px 0 16px; }
  .panel > a.open-link { font-size: 0.8rem; margin-top: 8px; }

  .rows { display: flex; flex-direction: column; gap: 10px; }
  .row-item { background: rgba(255, 255, 255, 0.045); border: 1px solid var(--glass-border); border-radius: 12px; padding: 12px 13px; }
  .row-item form { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-end; margin: 0; }
  .row-item .field { display: flex; flex-direction: column; gap: 3px; min-width: 110px; }
  .row-item .field label { font-size: 0.66rem; color: var(--muted-dim); text-transform: uppercase; letter-spacing: 0.05em; margin: 0; }
  .row-item input, .row-item select { margin-bottom: 0; padding: 7px 9px; font-size: 0.82rem; }
  .row-item .grow { flex: 1 1 160px; }
  .row-item .meta { font-family: var(--font-mono); font-size: 0.74rem; color: var(--muted); }
  .row-item .actions { display: flex; gap: 6px; margin-left: auto; }
  .row-item .actions button { padding: 6px 11px; font-size: 0.78rem; }
  .row-item .secondary-row { margin-top: 8px; display: flex; }

  .empty { color: var(--muted); font-size: 0.82rem; border: 1px dashed var(--glass-border); border-radius: 12px; padding: 16px; text-align: center; }

  .alltable-wrap { overflow-x: auto; }
  table.alltable { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  table.alltable th { text-align: left; padding: 7px 10px; color: var(--muted); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
  table.alltable td { text-align: left; padding: 8px 10px; border-top: 1px solid var(--glass-border); white-space: nowrap; }
  .pill { font-family: var(--font-mono); font-size: 0.68rem; padding: 2px 8px; border-radius: 999px; display: inline-block; }
  .pill.Sent, .pill.Approved, .pill.Followup-Sent { background: var(--good-bg); color: var(--good); }
  .pill.Pending { background: var(--glass); color: var(--muted); }
  .pill.Review { background: var(--warn-bg); color: var(--warn); }
  .pill.Skipped, .pill.Rejected, .pill.Failed { background: var(--bad-bg); color: var(--bad); }

  @media (max-width: 480px) {
    .row-item .actions { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
