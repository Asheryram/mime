<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Outreach Triage Desk{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Dark gradient backdrop with soft colour blobs; every panel is frosted
     glass (translucent + backdrop-filter blur) floating above it. */
  :root {
    --bg-1: #0a0e1a; --bg-3: #05131c;
    --fg: #eef1f7; --muted: #9aa3bf; --muted-dim: #6d7596;
    --glass: rgba(255, 255, 255, 0.07); --glass-hi: rgba(255, 255, 255, 0.12);
    --glass-border: rgba(255, 255, 255, 0.14);
    --row: rgba(255, 255, 255, 0.045);
    --accent: #2dd4c4; --accent-2: #a78bfa; --accent-fg: #062420;
    --good: #4ade9b; --good-bg: rgba(74, 222, 155, 0.16);
    --warn: #f5c451; --warn-bg: rgba(245, 196, 81, 0.16);
    --bad: #fb90a8; --bad-bg: rgba(251, 144, 168, 0.16);
    --font-ui: "IBM Plex Sans", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  /* Blobs are baked into the normal (scrolling) background instead of fixed
     position + blur() pseudo-elements, which only paint one viewport tall and
     go flat black below that on any page taller than the screen. */
  body {
    margin: 0; min-height: 100vh; color: var(--fg); font-family: var(--font-ui); font-size: 15px;
    background:
      radial-gradient(ellipse 65% 40% at 14% 0%, rgba(45, 212, 196, 0.24), transparent 65%),
      radial-gradient(ellipse 60% 45% at 88% 28%, rgba(13, 110, 120, 0.22), transparent 60%),
      radial-gradient(ellipse 70% 45% at 8% 92%, rgba(167, 139, 250, 0.20), transparent 65%),
      linear-gradient(160deg, var(--bg-1), var(--bg-3) 70%);
  }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 22px 16px 64px; }
  .auth-wrap { max-width: 400px; margin: 9vh auto; padding: 0 16px; }

  h1 { font-size: 1.45rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  h2 { font-size: 1rem; font-weight: 600; margin: 0; }
  h3 { font-size: 0.82rem; font-weight: 600; margin: 0 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .tagline { color: var(--muted); font-size: 0.88rem; margin-top: 3px; max-width: 64ch; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
  .small { font-size: 0.8rem; }
  .mono { font-family: var(--font-mono); font-size: 0.82rem; }

  .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
  .topbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .card-box {
    background: linear-gradient(155deg, var(--glass-hi), var(--glass));
    border: 1px solid var(--glass-border); border-radius: 18px; padding: 22px;
    backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
  }

  /* Forms */
  label { display: block; font-size: 0.74rem; color: var(--muted); margin-bottom: 4px; }
  input[type="text"], input[type="email"], input[type="password"], input[type="url"], input[type="search"], select, textarea {
    width: 100%; font: inherit; font-size: 0.9rem; color: var(--fg);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--glass-border); border-radius: 9px; padding: 9px 11px; margin-bottom: 14px;
  }
  textarea { font-family: var(--font-mono); font-size: 0.85rem; line-height: 1.55; resize: vertical; }
  input::placeholder, textarea::placeholder { color: var(--muted-dim); }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .check { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; color: var(--fg); margin-bottom: 10px; }
  .check input { width: 16px; height: 16px; accent-color: var(--accent); }

  /* Buttons */
  button, .btn {
    font: inherit; font-size: 0.85rem; font-weight: 600; border-radius: 9px; border: 1px solid transparent;
    padding: 8px 14px; cursor: pointer; white-space: nowrap; text-decoration: none; display: inline-block;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-fg);
  }
  button:hover, .btn:hover { filter: brightness(1.08); }
  .ghost { background: var(--glass) !important; color: var(--muted) !important; border-color: var(--glass-border) !important; }
  .ghost:hover { color: var(--fg) !important; }
  .good { background: var(--good-bg) !important; color: var(--good) !important; }
  .bad { background: var(--bad-bg) !important; color: var(--bad) !important; }
  .danger { background: transparent !important; color: var(--bad) !important; border-color: rgba(251, 144, 168, 0.45) !important; }
  .sm { padding: 6px 11px; font-size: 0.78rem; }
  .inline { display: inline; margin: 0; }

  .flash { border-radius: 11px; padding: 11px 14px; font-size: 0.86rem; margin-bottom: 16px; }
  .flash.error { background: var(--bad-bg); color: var(--bad); }
  .flash.success { background: var(--good-bg); color: var(--good); }
  .muted-link { font-size: 0.82rem; color: var(--muted); }

  /* Nav tabs */
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .tab {
    display: inline-flex; align-items: center; gap: 7px; font-size: 0.84rem; font-weight: 500;
    color: var(--muted); background: var(--glass); border: 1px solid var(--glass-border);
    border-radius: 999px; padding: 7px 14px; text-decoration: none; white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--accent-fg); background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; }
  .tab-count { font-family: var(--font-mono); font-size: 0.7rem; background: rgba(255, 255, 255, 0.14); border-radius: 999px; padding: 0 7px; }
  .tab.active .tab-count { background: rgba(0, 0, 0, 0.18); }
  .tab.alert:not(.active) .tab-count { background: var(--warn-bg); color: var(--warn); }

  /* Overview: the three things you'd act on */
  .action-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 20px; }
  .action-card { text-decoration: none; color: var(--fg); display: flex; flex-direction: column; gap: 6px; transition: transform 0.12s; }
  .action-card:hover { transform: translateY(-2px); }
  .action-label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .action-num { font-family: var(--font-mono); font-size: 2.3rem; line-height: 1.05; font-weight: 500; }
  .action-hint { font-size: 0.84rem; color: var(--muted); }
  .action-card.warn { border-color: rgba(245, 196, 81, 0.45); }
  .action-card.warn .action-num { color: var(--warn); }

  .split { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; margin-bottom: 20px; }
  .panel { display: flex; flex-direction: column; min-width: 0; margin-bottom: 20px; }
  .split > .panel { margin-bottom: 0; }
  .panel-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .panel-head .spacer { flex: 1; }
  .count-badge { font-family: var(--font-mono); font-size: 0.72rem; background: var(--glass); color: var(--muted); border-radius: 999px; padding: 1px 9px; }
  .hint { color: var(--muted); font-size: 0.84rem; margin: 0 0 16px; max-width: 72ch; }

  /* Pipeline status rows */
  .pipe { display: flex; flex-direction: column; gap: 12px; }
  .pipe-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; padding: 12px 14px; background: var(--row); border: 1px solid var(--glass-border); border-radius: 12px; }
  .pipe-name { font-weight: 600; font-size: 0.92rem; }
  .pipe-sched { color: var(--muted); font-size: 0.8rem; }
  .pipe-next { font-family: var(--font-mono); font-size: 0.82rem; text-align: right; }
  .pipe-last { grid-column: 1 / -1; font-size: 0.8rem; color: var(--muted); }

  /* Activity feed */
  .feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .feed li { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 9px 0; border-top: 1px solid var(--glass-border); font-size: 0.86rem; }
  .feed li:first-child { border-top: 0; }
  .feed .when { color: var(--muted); font-size: 0.78rem; white-space: nowrap; }

  /* Row cards (Needs you, Up next) */
  .rows { display: flex; flex-direction: column; gap: 10px; }
  .row-item { background: var(--row); border: 1px solid var(--glass-border); border-radius: 13px; padding: 14px; }
  .row-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .row-top .name { font-weight: 600; }
  .row-top .name a { color: var(--fg); text-decoration: none; }
  .row-top .name a:hover { text-decoration: underline; }
  .row-form { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: flex-end; margin: 0; }
  .row-form .field { display: flex; flex-direction: column; min-width: 180px; flex: 1 1 220px; }
  .row-form input, .row-form select { margin-bottom: 0; }
  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .empty { color: var(--muted); font-size: 0.86rem; border: 1px dashed var(--glass-border); border-radius: 12px; padding: 18px; text-align: center; }

  /* Filter chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chip { font-size: 0.8rem; color: var(--muted); background: var(--glass); border: 1px solid var(--glass-border); border-radius: 999px; padding: 5px 12px; text-decoration: none; }
  .chip:hover { color: var(--fg); }
  .chip.active { color: var(--fg); border-color: var(--accent); background: rgba(45, 212, 196, 0.12); }
  .chip .n { font-family: var(--font-mono); font-size: 0.72rem; margin-left: 4px; opacity: 0.8; }

  .searchbar { display: flex; gap: 8px; margin-bottom: 14px; }
  .searchbar input { margin: 0; }

  /* Tables */
  .table-wrap { overflow-x: auto; }
  table.data { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  table.data th { text-align: left; padding: 8px 10px; color: var(--muted); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
  table.data td { text-align: left; padding: 10px; border-top: 1px solid var(--glass-border); vertical-align: middle; }
  table.data td.nowrap { white-space: nowrap; }
  table.data tr:hover td { background: rgba(255, 255, 255, 0.03); }
  table.data a.rowlink { color: var(--fg); font-weight: 500; text-decoration: none; }
  table.data a.rowlink:hover { text-decoration: underline; }
  .num { font-family: var(--font-mono); color: var(--muted); }

  .pill { font-family: var(--font-mono); font-size: 0.7rem; padding: 2px 8px; border-radius: 999px; display: inline-block; white-space: nowrap; }
  .pill.Sent, .pill.Approved, .pill.Followup-Sent, .pill.replied, .pill.today { background: var(--good-bg); color: var(--good); }
  .pill.Pending, .pill.later { background: var(--glass); color: var(--muted); }
  .pill.Review { background: var(--warn-bg); color: var(--warn); }
  .pill.Skipped, .pill.Rejected, .pill.Failed, .pill.bounced { background: var(--bad-bg); color: var(--bad); }
  .pill.ok { background: var(--good-bg); color: var(--good); }
  .pill.running { background: rgba(167, 139, 250, 0.18); color: var(--accent-2); }
  .pill.fail { background: var(--bad-bg); color: var(--bad); }

  /* Detail / new company form */
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0 16px; }
  .form-grid .full { grid-column: 1 / -1; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 0.85rem; margin: 0; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-family: var(--font-mono); font-size: 0.8rem; word-break: break-all; }
  .form-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
  .callout { border-radius: 12px; padding: 12px 14px; font-size: 0.86rem; margin-bottom: 16px; }
  .callout.warn { background: var(--warn-bg); color: var(--warn); }
  .callout.info { background: var(--glass); color: var(--muted); border: 1px solid var(--glass-border); }

  @media (max-width: 560px) {
    .wrap { padding-top: 16px; }
    .action-num { font-size: 1.9rem; }
    .pipe-row { grid-template-columns: 1fr; }
    .pipe-next { text-align: left; }
  }
  @media (prefers-reduced-motion: reduce) {
    .action-card { transition: none; }
    .action-card:hover { transform: none; }
  }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
